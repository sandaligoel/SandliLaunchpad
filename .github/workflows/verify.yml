name: verify

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Placeholder scan
        run: python scripts/check_placeholders.py
      - name: Import check
        run: python -c "import main, run_workflow, config; from agent_library.build.ingest.agent import execute; from agent_library.build.validate.agent import execute as validate_execute"
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Dry run
        run: python main.py --dry-run

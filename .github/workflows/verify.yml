name: verify

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Placeholder scan
        run: python scripts/check_placeholders.py
      - name: Import check
        run: python -c "import main, run_workflow, config"
      - name: Pytest
        run: python -m pytest tests/ -q
      - name: Dry run
        run: python main.py --dry-run --input-json examples/sample_question.json
